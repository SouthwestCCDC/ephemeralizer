[project]
name = "ephemeralizer"
version = "0.2"
dependencies = [
    "minio==7.2.14",
    "click==8.1.8",
    "truststore==0.10.0",
]

[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
ephemeralizer = "ephemeralizer.cli:ephemeralizer"

[project.entry-points."pipx.run"]
ephemeralizerd = "ephemeralizer.cli:ephemeralizer"
